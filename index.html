<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Happy Birthday, Bubu 💖</title>
  <meta name="description" content="A little birthday surprise for Bubu." />
  <meta name="theme-color" content="#ff8fc7" />
  <meta property="og:title" content="Happy Birthday, Bubu 💖" />
  <meta property="og:description" content="Open your gift 🎁" />
  <meta property="og:image" content="images/1.jpg" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎁</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Dancing+Script:wght@700&family=Cormorant+Garamond:ital,wght@1,600&family=Quicksand:wght@700&display=swap" rel="stylesheet" />
  <link rel="preload" as="image" href="images/1.jpg" fetchpriority="high" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- Wallpaper slideshow -->
  <div class="slides" id="slides" aria-hidden="true"></div>
  <div class="tint" aria-hidden="true"></div>

  <!-- Balloons, hearts, sparkles, confetti -->
  <canvas id="fx" aria-hidden="true"></canvas>

  <main class="hero">
    <h1 class="title">
      <span class="title-top">Happy Birthday</span>
      <span class="title-name">Bubu</span>
    </h1>

    <button class="gift" id="gift" type="button" aria-label="Open your gift">
      <span class="gift-glow"></span>
      <span class="gift-rays"></span>
      <span class="gift-shadow"></span>
      <span class="gift-body"></span>
      <span class="gift-lid">
        <span class="bow bow-l"></span>
        <span class="bow bow-r"></span>
        <span class="bow-knot"></span>
      </span>
    </button>

    <p class="hint" id="hint">✨ <span id="hint-verb">Click</span> the gift to open it <span class="hint-name">my motki Bubu ✨</span></p>
  </main>

  <!-- Letter pop-up -->
  <div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="letter-title" hidden>
    <div class="marquee" aria-hidden="true"><div class="track" id="track"></div></div>

    <article class="letter" id="letter">
      <button class="close" id="close" type="button" aria-label="Close">&times;</button>
      <div class="letter-scroll" id="letter-scroll" tabindex="0">
        <h2 class="letter-name" id="letter-title">My Bubu</h2>
        <div class="ornament" aria-hidden="true">♡</div>
        <div class="poem" id="poem"></div>
        <p class="signature">Happy Birthday</p>

        <section class="wish" id="wish" aria-labelledby="wish-title">
          <h3 class="wish-title" id="wish-title">Make a wish</h3>
          <p class="wish-hint" id="wish-hint">Once you've made a wish Bubu, tap the cake my love 🎂</p>

          <button class="cake" id="cake" type="button" aria-label="Tap the cake">
            <span class="candles">
              <span class="candle"><span class="flame"></span><span class="smoke"></span></span>
              <span class="candle"><span class="flame"></span><span class="smoke"></span></span>
              <span class="candle"><span class="flame"></span><span class="smoke"></span></span>
            </span>
            <span class="tier tier-top"></span>
            <span class="tier tier-bottom"></span>
            <span class="plate"></span>
          </button>

          <div class="wish-burst" id="wish-burst" aria-hidden="true"></div>

          <figure class="memory wish-video" id="wish-video" hidden>
            <video src="videos/wish.mp4" playsinline preload="none"></video>
          </figure>
        </section>
        <div class="ornament ornament-end" aria-hidden="true">❦</div>
      </div>
    </article>

    <!-- Shown after the wish video ends -->
    <figure class="finale" id="finale" hidden>
      <button class="back" id="back" type="button" aria-label="Start again">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <defs>
            <linearGradient id="back-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff5fa2" />
              <stop offset="1" stop-color="#9b45f5" />
            </linearGradient>
          </defs>
          <path d="M18 13 L9 21 L18 29" />
          <path d="M10 21 H27 C34.5 21 39 25.5 39 31.5 C39 37 34.5 40 29 40 H23" />
        </svg>
      </button>
      <div class="memory finale-frame">
        <img src="images/forever.webp" alt="Dudu kneeling with a birthday cake before Bubu in her wedding dress, under the words happy birthday my love, and: I lif lof u baby motki, smart bubu love very bzzaf muuh" width="1145" height="1374" decoding="async" />
      </div>
      <figcaption class="forever-caption">
        <span class="forever-words">My eternal love</span>
        <svg class="forever-heart" viewBox="0 0 32 29" aria-hidden="true">
          <defs>
            <linearGradient id="heart-grad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#ff5fa2" />
              <stop offset="1" stop-color="#e0245e" />
            </linearGradient>
          </defs>
          <path d="M16 28.5S1.5 19.6 1.5 9.8A7.6 7.6 0 0 1 16 6.3a7.6 7.6 0 0 1 14.5 3.5c0 9.8-14.5 18.7-14.5 18.7z" />
        </svg>
      </figcaption>
    </figure>
  </div>

  <script src="music.js"></script>
  <script src="script.js"></script>
</body>
</html>
